name: Windows installer
'on':
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 was not found on this runner.' }
          "ISCC_PATH=$compiler" >> $env:GITHUB_ENV
      - name: Build, install, upgrade and verify
        run: python build_release.py
      - name: Keep verified installer
        uses: actions/upload-artifact@v4
        with:
          name: SNSMediaCollector-Windows-Setup
          path: |
            release-output/SNSMediaCollector-Setup-*.exe
            release-output/SHA256SUMS.txt
            release-output/release-check.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish automatic-update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content RELEASE_VERSION.txt -Raw).Trim()
          $tag = "v$version"
          $setup = "release-output/SNSMediaCollector-Setup-$version.exe"
          $files = @($setup, 'release-output/SHA256SUMS.txt', 'release-output/release-check.json')
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @files --latest --repo $env:GITHUB_REPOSITORY `
              --title "SNS Media Collector $version" `
              --notes "Windows自動更新対応版。アプリ内の「更新を確認」から取得できます。"
          }
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-reports
          path: |
            release-output/*.json
            release-output/*.log
          if-no-files-found: ignore
          retention-days: 14
